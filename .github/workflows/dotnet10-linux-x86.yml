name: Build .NET 10 linux-x86

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        default: v10.0.0
        required: true
      aspnetcore_tag:
        default: v10.0.0
        required: true
      sdk_tag:
        default: v10.0.100
        required: true
      aspire_tag:
        default: v10.0.0
        required: true
      installer_tag:
        default: v10.0.100
        required: true

permissions:
  contents: read

env:
  CONFIGURATION: Release
  TARGET_ARCH: x86
  TARGET_OS: Linux
  TARGET_RID: linux-x86
  RUNTIME_REF: ${{ startsWith(inputs.runtime_tag, 'v') && inputs.runtime_tag || format('v{0}', inputs.runtime_tag) }}
  ASPNETCORE_REF: ${{ startsWith(inputs.aspnetcore_tag, 'v') && inputs.aspnetcore_tag || format('v{0}', inputs.aspnetcore_tag) }}
  SDK_REF: ${{ startsWith(inputs.sdk_tag, 'v') && inputs.sdk_tag || format('v{0}', inputs.sdk_tag) }}
  ASPIRE_REF: ${{ startsWith(inputs.aspire_tag, 'v') && inputs.aspire_tag || format('v{0}', inputs.aspire_tag) }}
  INSTALLER_REF: ${{ startsWith(inputs.installer_tag, 'v') && inputs.installer_tag || format('v{0}', inputs.installer_tag) }}

jobs:
  runtime:
    name: Build runtime linux-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 0

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v6

      - name: Checkout runtime
        uses: actions/checkout@v6
        with:
          repository: dotnet/runtime
          ref: ${{ env.RUNTIME_REF }}
          path: runtime
          fetch-depth: 0
          fetch-tags: true

      - name: Create helper functions
        shell: bash
        run: |
          cat > common.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          calculate_build_id() {
            local TAG="${1:-}"
            local REGEX='-(preview|rc|rtm)\.[0-9]\.([0-9]{5})\.([0-9]{1,2})'
            if [[ "$TAG" =~ $REGEX ]]; then
              local MAJOR="${BASH_REMATCH[2]}"
              local MINOR="${BASH_REMATCH[3]}"
              local YEAR=$((MAJOR / 1000 + 2000))
              local MONTH=$(((MAJOR % 1000) / 50))
              local DAY=$((MAJOR % 50))
              local DATE=$((YEAR * 10000 + MONTH * 100 + DAY))
              export OFFICIALBUILDID="${DATE}.${MINOR}"
            else
              export OFFICIALBUILDID="$(date +%Y%m%d).99"
            fi
          }
          EOF
          chmod +x common.sh

      - name: Create linux-x86 crossroot Dockerfile
        shell: bash
        run: |
          mkdir -p dotnet-linux-x86
          cat > dotnet-linux-x86/Dockerfile <<'EOF'
          FROM debian:12
          ENV DEBIAN_FRONTEND=noninteractive
          ENV ROOTFS_DIR=/crossrootfs/x86
          RUN dpkg --add-architecture i386 && \
              apt-get update && \
              apt-get install -y --no-install-recommends \
                bash ca-certificates clang cmake curl file \
                g++ gcc gcc-i686-linux-gnu g++-i686-linux-gnu \
                git jq libicu-dev libkrb5-dev liblttng-ust-dev libssl-dev \
                lldb llvm make ninja-build pkg-config zip \
                python3 python3-pip python-is-python3 zlib1g-dev \
                libc6-dev:i386 libstdc++-12-dev:i386 linux-libc-dev:i386 zlib1g-dev:i386 \
                libkrb5-dev:i386 libssl-dev:i386 libicu-dev:i386 liblttng-ust-dev:i386 liburcu-dev:i386 \
                && rm -rf /var/lib/apt/lists/*
          RUN mkdir -p ${ROOTFS_DIR}/usr ${ROOTFS_DIR}/lib ${ROOTFS_DIR}/usr/lib ${ROOTFS_DIR}/usr/lib/gcc && \
              cp -a /usr/include ${ROOTFS_DIR}/usr/ && \
              cp -a /usr/lib/i386-linux-gnu ${ROOTFS_DIR}/usr/lib/ && \
              cp -a /lib/i386-linux-gnu ${ROOTFS_DIR}/lib/ && \
              cp -a /lib/ld-linux.so.2 ${ROOTFS_DIR}/lib/ || true && \
              cp -a /usr/lib/gcc/i686-linux-gnu ${ROOTFS_DIR}/usr/lib/gcc/ || true && \
              ln -s i386-linux-gnu ${ROOTFS_DIR}/usr/lib/i686-linux-gnu || true && \
              ln -s i386-linux-gnu ${ROOTFS_DIR}/lib/i686-linux-gnu || true && \
              find ${ROOTFS_DIR} \( -name 'lttng-ust.pc' -o -name 'liblttng-ust.so*' -o -path '*/lttng/tracepoint.h' \) -print
          WORKDIR /
          EOF
          docker build -t dotnet-linux-x86 -f dotnet-linux-x86/Dockerfile .

      - name: Patch runtime
        shell: bash
        run: |
          set -euo pipefail
          git -C runtime checkout "$RUNTIME_REF"
          sed -i '/\/dnceng\/internal\//d' runtime/NuGet.config || true
          sed -i 's/return/__SkipCrossArchBuild=0/' runtime/src/coreclr/build-runtime.sh || true
          sed -i '/AppHostRuntimeIdentifier/d' runtime/src/coreclr/tools/aot/crossgen2/crossgen2.csproj || true
          sed -i '/<PublishSingleFile>/d' runtime/src/coreclr/tools/aot/ILCompiler/ILCompiler.csproj || true
          sed -i '/<PublishSingleFile>/d' runtime/src/coreclr/tools/aot/ILCompiler/ILCompiler_inbuild.csproj || true
          sed -i '/<PublishTrimmed>/d' runtime/src/coreclr/tools/aot/ILCompiler/ILCompiler.csproj || true
          sed -i '/<PublishTrimmed>/d' runtime/src/coreclr/tools/aot/ILCompiler/ILCompiler_inbuild.csproj || true
          if grep -q 'PublishReadyToRun Condition' runtime/src/installer/pkg/sfx/Microsoft.NETCore.App/Microsoft.NETCore.App.Runtime.props; then
            sed -i '/PublishReadyToRun Condition/a \ \ \ \ <PublishReadyToRun>false<\/PublishReadyToRun>' runtime/src/installer/pkg/sfx/Microsoft.NETCore.App/Microsoft.NETCore.App.Runtime.props
          fi
          sed -i '/crossgen-corelib/d' runtime/eng/Subsets.props || true

      - name: Build runtime
        shell: bash
        run: |
          set -euo pipefail
          source ./common.sh

          TAG="$(git -C runtime tag --points-at HEAD | head -n1 || true)"
          calculate_build_id "$TAG"
          echo "OFFICIALBUILDID=$OFFICIALBUILDID"

          docker run --rm \
            -e ROOTFS_DIR=/crossrootfs/x86 \
            -e PKG_CONFIG_LIBDIR=/crossrootfs/x86/usr/lib/i386-linux-gnu/pkgconfig:/crossrootfs/x86/usr/lib/pkgconfig:/crossrootfs/x86/usr/share/pkgconfig \
            -e PKG_CONFIG_SYSROOT_DIR=/crossrootfs/x86 \
            -v "$GITHUB_WORKSPACE/runtime:/runtime" \
            dotnet-linux-x86 \
            /runtime/eng/build.sh \
              -ci \
              -c Release \
              -cross \
              -os Linux \
              -arch x86 \
              /p:OfficialBuildId="$OFFICIALBUILDID" \
              -subset Clr.Native+Host.Native

          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/runtime/artifacts" || true
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/runtime/.dotnet" || true

          BOOTSTRAP_DOTNET="$GITHUB_WORKSPACE/runtime/.dotnet/dotnet"

          if [[ ! -x "$BOOTSTRAP_DOTNET" ]]; then
            echo "Cannot find bootstrap dotnet: $BOOTSTRAP_DOTNET"
            find "$GITHUB_WORKSPACE/runtime/.dotnet" -maxdepth 3 -type f -name dotnet -print || true
            exit 1
          fi

          BOOTSTRAP_SDK_VERSION="$("$BOOTSTRAP_DOTNET" --version)"
          echo "BOOTSTRAP_SDK_VERSION=$BOOTSTRAP_SDK_VERSION"

          SDK_BUNDLED_PROPS="$GITHUB_WORKSPACE/runtime/.dotnet/sdk/$BOOTSTRAP_SDK_VERSION/Microsoft.NETCoreSdk.BundledVersions.props"

          echo "Patching SDK bundled props: $SDK_BUNDLED_PROPS"

          if [[ -z "$SDK_BUNDLED_PROPS" || ! -f "$SDK_BUNDLED_PROPS" ]]; then
            echo "Cannot find Microsoft.NETCoreSdk.BundledVersions.props for bootstrap SDK $BOOTSTRAP_SDK_VERSION"
            find "$GITHUB_WORKSPACE/runtime/.dotnet/sdk" -type f -name 'Microsoft.NETCoreSdk.BundledVersions.props' -print || true
            exit 1
          fi

          HOST_PACK_VERSION="$(grep -oPm1 'AppHostPackVersion="\K[^"]+' "$SDK_BUNDLED_PROPS" || true)"

          if [[ -z "$HOST_PACK_VERSION" ]]; then
            HOST_PACK_VERSION="$(grep -oPm1 'RuntimePackVersion="\K[^"]+' "$SDK_BUNDLED_PROPS" || true)"
          fi

          if [[ -z "$HOST_PACK_VERSION" ]]; then
            HOST_PACK_VERSION="$(grep -oPm1 'TargetingPackVersion="\K[^"]+' "$SDK_BUNDLED_PROPS" || true)"
          fi

          if [[ -z "$HOST_PACK_VERSION" ]]; then
            echo "Cannot detect HOST_PACK_VERSION from $SDK_BUNDLED_PROPS"
            echo "Relevant lines:"
            grep -nE 'KnownAppHostPack|AppHostPackVersion|RuntimePackVersion|TargetingPackVersion|Microsoft\.NETCore\.App' "$SDK_BUNDLED_PROPS" || true
            exit 1
          fi

          echo "HOST_PACK_VERSION=$HOST_PACK_VERSION"

          HOST_PACK_ROOT="$GITHUB_WORKSPACE/runtime/.dotnet/packs/Microsoft.NETCore.App.Host.linux-x86"
          HOST_PACK_DIR="$HOST_PACK_ROOT/${HOST_PACK_VERSION}/runtimes/linux-x86/native"

          sudo mkdir -p "$HOST_PACK_DIR"
          sudo chown -R "$USER:$USER" "$HOST_PACK_ROOT"

          APPHOST_SOURCE=""

          for candidate in \
            "$GITHUB_WORKSPACE/runtime/artifacts/obj/linux-x86.Release/apphost/standalone/apphost" \
            "$GITHUB_WORKSPACE/runtime/artifacts/bin/linux-x86.Release/corehost/apphost" \
            "$GITHUB_WORKSPACE/runtime/artifacts/bin/linux-x86.Release/corehost_test/nativehost"
          do
            if [[ -f "$candidate" ]]; then
              APPHOST_SOURCE="$candidate"
              break
            fi
          done

          if [[ -z "$APPHOST_SOURCE" ]]; then
            echo "Cannot find linux-x86 apphost/nativehost."
            find "$GITHUB_WORKSPACE/runtime/artifacts" -type f \( -name apphost -o -name nativehost \) -print || true
            exit 1
          fi

          cp "$APPHOST_SOURCE" "$HOST_PACK_DIR/apphost"
          chmod +x "$HOST_PACK_DIR/apphost"

          echo "Installed Microsoft.NETCore.App.Host.linux-x86:"
          ls -l "$HOST_PACK_DIR"
          file "$HOST_PACK_DIR/apphost"

          LOCAL_PACKAGES="$GITHUB_WORKSPACE/runtime/artifacts/local-packages"

          sudo mkdir -p "$LOCAL_PACKAGES"
          sudo chown -R "$(id -u):$(id -g)" "$LOCAL_PACKAGES"

          PKG_WORK="$LOCAL_PACKAGES/pkg-host-linux-x86"
          rm -rf "$PKG_WORK"
          mkdir -p "$PKG_WORK/runtimes/linux-x86/native" "$LOCAL_PACKAGES"

          cp "$HOST_PACK_DIR/apphost" "$PKG_WORK/runtimes/linux-x86/native/apphost"
          chmod +x "$PKG_WORK/runtimes/linux-x86/native/apphost"

          cat > "$PKG_WORK/Microsoft.NETCore.App.Host.linux-x86.nuspec" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd">
            <metadata>
              <id>Microsoft.NETCore.App.Host.linux-x86</id>
              <version>${HOST_PACK_VERSION}</version>
              <authors>Microsoft</authors>
              <description>Microsoft.NETCore.App.Host.linux-x86</description>
              <packageTypes>
                <packageType name="DotnetPlatform" />
              </packageTypes>
            </metadata>
          </package>
          EOF

          (
            cd "$PKG_WORK"
            zip -qr "$LOCAL_PACKAGES/Microsoft.NETCore.App.Host.linux-x86.${HOST_PACK_VERSION}.nupkg" .
          )

          echo "Created local host pack:"
          ls -l "$LOCAL_PACKAGES"

          dotnet nuget remove source local-linux-x86-host \
            --configfile "$GITHUB_WORKSPACE/runtime/NuGet.config" || true

          dotnet nuget add source "/runtime/artifacts/local-packages" \
            --name local-linux-x86-host \
            --configfile "$GITHUB_WORKSPACE/runtime/NuGet.config" || true

          sed -i 's/linux-x64;/linux-x64;linux-x86;/g' "$SDK_BUNDLED_PROPS"
          sed -i 's/linux-musl-x64;/linux-musl-x64;linux-x86;/g' "$SDK_BUNDLED_PROPS"

          grep -n "linux-x86" "$SDK_BUNDLED_PROPS" || {
            echo "Failed to inject linux-x86 into SDK KnownAppHostPack list"
            exit 1
          }

          docker run --rm \
            -e ROOTFS_DIR=/crossrootfs/x86 \
            -e PKG_CONFIG_LIBDIR=/crossrootfs/x86/usr/lib/i386-linux-gnu/pkgconfig:/crossrootfs/x86/usr/lib/pkgconfig:/crossrootfs/x86/usr/share/pkgconfig \
            -e PKG_CONFIG_SYSROOT_DIR=/crossrootfs/x86 \
            -v "$GITHUB_WORKSPACE/runtime:/runtime" \
            dotnet-linux-x86 \
            /runtime/eng/build.sh \
              -ci \
              -c Release \
              -cross \
              -os Linux \
              -arch x86 \
              /p:OfficialBuildId="$OFFICIALBUILDID" \
              /p:PublishAot=false \
              /p:PublishReadyToRun=false \
              /p:PublishSingleFile=false \
              /p:PublishTrimmed=false \
              /p:UseAppHost=true \
              /p:DisableAppHost=false \
              /p:SelfContained=false \
              /p:AppHostSourcePath=/runtime/artifacts/obj/linux-x86.Release/apphost/standalone/apphost

      - name: Upload runtime packages
        uses: actions/upload-artifact@v6
        with:
          name: RuntimePackages
          path: runtime/artifacts/packages/Release/Shipping
          if-no-files-found: error

  aspire:
    name: Build Aspire
    runs-on: ubuntu-24.04
    timeout-minutes: 0

    steps:
      - uses: actions/checkout@v6

      - name: Checkout aspire
        uses: actions/checkout@v6
        with:
          repository: microsoft/aspire
          ref: ${{ env.ASPIRE_REF }}
          path: aspire
          fetch-depth: 0
          fetch-tags: true

      - name: Create helper functions
        shell: bash
        run: |
          cat > common.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          calculate_build_id() {
            local TAG="${1:-}"
            local REGEX='-(preview|rc|rtm)\.[0-9]\.([0-9]{5})\.([0-9]{1,2})'
            if [[ "$TAG" =~ $REGEX ]]; then
              local MAJOR="${BASH_REMATCH[2]}"
              local MINOR="${BASH_REMATCH[3]}"
              local YEAR=$((MAJOR / 1000 + 2000))
              local MONTH=$(((MAJOR % 1000) / 50))
              local DAY=$((MAJOR % 50))
              local DATE=$((YEAR * 10000 + MONTH * 100 + DAY))
              export OFFICIALBUILDID="${DATE}.${MINOR}"
            else
              export OFFICIALBUILDID="$(date +%Y%m%d).99"
            fi
          }
          EOF

      - name: Patch Aspire
        shell: bash
        run: |
          set -euo pipefail
          git -C aspire checkout "$ASPIRE_REF"
          sed -i '/\/dnceng\/internal\//d' aspire/NuGet.config || true

      - name: Build Aspire
        shell: bash
        run: |
          set -euo pipefail
          source ./common.sh
          TAG="$(git -C aspire tag --points-at HEAD | head -n1 || true)"
          calculate_build_id "$TAG"
          echo "OFFICIALBUILDID=$OFFICIALBUILDID"
          aspire/build.sh \
            --restore \
            --build \
            --pack \
            --ci \
            -c Release \
            /p:OfficialBuildId="$OFFICIALBUILDID"

      - name: Upload Aspire packages
        uses: actions/upload-artifact@v6
        with:
          name: AspirePackages
          path: aspire/artifacts/packages/Release/Shipping
          if-no-files-found: warn

  sdk:
    name: Build SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 0

    steps:
      - uses: actions/checkout@v6

      - name: Checkout sdk
        uses: actions/checkout@v6
        with:
          repository: dotnet/sdk
          ref: ${{ env.SDK_REF }}
          path: sdk
          fetch-depth: 0
          fetch-tags: true

      - name: Create helper functions
        shell: bash
        run: |
          cat > common.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          calculate_build_id() {
            local TAG="${1:-}"
            local REGEX='-(preview|rc|rtm)\.[0-9]\.([0-9]{5})\.([0-9]{1,2})'
            if [[ "$TAG" =~ $REGEX ]]; then
              local MAJOR="${BASH_REMATCH[2]}"
              local MINOR="${BASH_REMATCH[3]}"
              local YEAR=$((MAJOR / 1000 + 2000))
              local MONTH=$(((MAJOR % 1000) / 50))
              local DAY=$((MAJOR % 50))
              local DATE=$((YEAR * 10000 + MONTH * 100 + DAY))
              export OFFICIALBUILDID="${DATE}.${MINOR}"
            else
              export OFFICIALBUILDID="$(date +%Y%m%d).99"
            fi
          }
          EOF

      - name: Checkout SDK tag
        shell: bash
        run: |
          set -euo pipefail
          git -C sdk checkout "$SDK_REF"
          sed -i '/\/dnceng\/internal\//d' sdk/NuGet.config || true

      - name: Build SDK
        shell: bash
        run: |
          set -euo pipefail
          source ./common.sh
          TAG="$(git -C sdk tag --points-at HEAD | head -n1 || true)"
          calculate_build_id "$TAG"
          echo "OFFICIALBUILDID=$OFFICIALBUILDID"
          sdk/build.sh \
            -c Release \
            -pack \
            -ci \
            /p:OfficialBuildId="$OFFICIALBUILDID"

      - name: Upload SDK packages
        uses: actions/upload-artifact@v6
        with:
          name: SdkPackages
          path: sdk/artifacts/packages/Release/NonShipping
          if-no-files-found: warn

  aspnetcore:
    name: Build ASP.NET Core linux-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 0
    needs: runtime

    steps:
      - uses: actions/checkout@v6

      - name: Checkout aspnetcore
        uses: actions/checkout@v6
        with:
          repository: dotnet/aspnetcore
          ref: ${{ env.ASPNETCORE_REF }}
          path: aspnetcore
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Download runtime packages
        uses: actions/download-artifact@v6
        with:
          name: RuntimePackages
          path: runtime/artifacts/packages/Release/Shipping

      - name: Create helper functions
        shell: bash
        run: |
          cat > common.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          calculate_build_id() {
            local TAG="${1:-}"
            local REGEX='-(preview|rc|rtm)\.[0-9]\.([0-9]{5})\.([0-9]{1,2})'
            if [[ "$TAG" =~ $REGEX ]]; then
              local MAJOR="${BASH_REMATCH[2]}"
              local MINOR="${BASH_REMATCH[3]}"
              local YEAR=$((MAJOR / 1000 + 2000))
              local MONTH=$(((MAJOR % 1000) / 50))
              local DAY=$((MAJOR % 50))
              local DATE=$((YEAR * 10000 + MONTH * 100 + DAY))
              export OFFICIALBUILDID="${DATE}.${MINOR}"
            else
              export OFFICIALBUILDID="$(date +%Y%m%d).99"
            fi
          }
          EOF

      - name: Patch ASP.NET Core
        shell: bash
        run: |
          set -euo pipefail
          git -C aspnetcore checkout "$ASPNETCORE_REF"
          git -C aspnetcore submodule update --init --recursive
          sed -i '/\/dnceng\/internal\//d' aspnetcore/NuGet.config || true
          dotnet nuget add source "$GITHUB_WORKSPACE/runtime/artifacts/packages/Release/Shipping" \
            --name local-runtime \
            --configfile aspnetcore/NuGet.config || true
          sed -i 's/linux-x64;/linux-x64;linux-x86;/' aspnetcore/Directory.Build.props || true
          if grep -q 'Microsoft.NETCore.App.Runtime.linux-x64' aspnetcore/eng/Dependencies.props; then
            sed -i '/<LatestPackageReference Include="Microsoft.NETCore.App.Runtime.linux-x64" \/>/a \ \ \ \ <LatestPackageReference Include="Microsoft.NETCore.App.Runtime.linux-x86" \/>' aspnetcore/eng/Dependencies.props
          fi

      - name: Build ASP.NET Core
        shell: bash
        run: |
          set -euo pipefail
          source ./common.sh
          TAG="$(git -C aspnetcore tag --points-at HEAD | head -n1 || true)"
          calculate_build_id "$TAG"
          echo "OFFICIALBUILDID=$OFFICIALBUILDID"
          mkdir -p aspnetcore/artifacts/obj/Microsoft.AspNetCore.App.Runtime
          cp runtime/artifacts/packages/Release/Shipping/dotnet-runtime-*-linux-x86.tar.gz \
            aspnetcore/artifacts/obj/Microsoft.AspNetCore.App.Runtime/
          aspnetcore/eng/build.sh \
            -c Release \
            -ci \
            -arch x86 \
            -pack \
            /p:CrossgenOutput=false \
            /p:OfficialBuildId="$OFFICIALBUILDID"

      - name: Upload ASP.NET Core packages
        uses: actions/upload-artifact@v6
        with:
          name: AspNetCorePackages
          path: aspnetcore/artifacts/packages/Release/Shipping
          if-no-files-found: error

      - name: Upload ASP.NET Core installers
        uses: actions/upload-artifact@v6
        with:
          name: AspNetCoreInstallers
          path: aspnetcore/artifacts/installers/Release
          if-no-files-found: warn

  installer:
    name: Build installer linux-x86
    runs-on: ubuntu-24.04
    timeout-minutes: 0
    needs:
      - runtime
      - aspnetcore
      - aspire

    steps:
      - uses: actions/checkout@v6

      - name: Checkout installer
        uses: actions/checkout@v6
        with:
          repository: dotnet/installer
          ref: ${{ env.INSTALLER_REF }}
          path: installer
          fetch-depth: 0
          fetch-tags: true

      - name: Download runtime packages
        uses: actions/download-artifact@v6
        with:
          name: RuntimePackages
          path: runtime/artifacts/packages/Release/Shipping

      - name: Download ASP.NET Core packages
        uses: actions/download-artifact@v6
        with:
          name: AspNetCorePackages
          path: aspnetcore/artifacts/packages/Release/Shipping

      - name: Download ASP.NET Core installers
        uses: actions/download-artifact@v6
        with:
          name: AspNetCoreInstallers
          path: aspnetcore/artifacts/installers/Release

      - name: Download Aspire packages
        uses: actions/download-artifact@v6
        with:
          name: AspirePackages
          path: aspire/artifacts/packages/Release/Shipping

      - name: Create helper functions
        shell: bash
        run: |
          cat > common.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          calculate_build_id() {
            local TAG="${1:-}"
            local REGEX='-(preview|rc|rtm)\.[0-9]\.([0-9]{5})\.([0-9]{1,2})'
            if [[ "$TAG" =~ $REGEX ]]; then
              local MAJOR="${BASH_REMATCH[2]}"
              local MINOR="${BASH_REMATCH[3]}"
              local YEAR=$((MAJOR / 1000 + 2000))
              local MONTH=$(((MAJOR % 1000) / 50))
              local DAY=$((MAJOR % 50))
              local DATE=$((YEAR * 10000 + MONTH * 100 + DAY))
              export OFFICIALBUILDID="${DATE}.${MINOR}"
            else
              export OFFICIALBUILDID="$(date +%Y%m%d).99"
            fi
          }
          EOF

      - name: Patch installer
        shell: bash
        run: |
          set -euo pipefail
          git -C installer checkout "$INSTALLER_REF"
          dotnet nuget remove source msbuild --configfile installer/NuGet.config || true
          dotnet nuget remove source nuget-build --configfile installer/NuGet.config || true
          dotnet nuget add source "$GITHUB_WORKSPACE/runtime/artifacts/packages/Release/Shipping" \
            --name runtime \
            --configfile installer/NuGet.config || true
          dotnet nuget add source "$GITHUB_WORKSPACE/aspnetcore/artifacts/packages/Release/Shipping" \
            --name aspnetcore \
            --configfile installer/NuGet.config || true
          dotnet nuget add source "$GITHUB_WORKSPACE/aspire/artifacts/packages/Release/Shipping" \
            --name aspire \
            --configfile installer/NuGet.config || true
          sed -i '/\/dnceng\/internal\//d' installer/NuGet.config || true
          sed -i 's/linux-s390x/linux-s390x;linux-x86/g' \
            installer/src/redist/targets/GenerateBundledVersions.targets || true

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          source ./common.sh
          TAG="$(git -C installer tag --points-at HEAD | head -n1 || true)"
          calculate_build_id "$TAG"
          echo "OFFICIALBUILDID=$OFFICIALBUILDID"
          mkdir -p installer/artifacts/obj/redist/Release/downloads/
          cp runtime/artifacts/packages/Release/Shipping/dotnet-runtime-*-linux-x86.tar.gz \
            installer/artifacts/obj/redist/Release/downloads/
          cp aspnetcore/artifacts/installers/Release/aspnetcore-runtime-* \
            installer/artifacts/obj/redist/Release/downloads/ || true
          installer/build.sh \
            -c Release \
            -ci \
            -pack \
            --architecture x86 \
            --runtime-id linux-x86 \
            /p:DISABLE_CROSSGEN=True \
            /p:OfficialBuildId="$OFFICIALBUILDID" \
            /p:IncludeAspNetCoreRuntime=True \
            /p:HostRid=linux-x64

      - name: Upload installer packages
        uses: actions/upload-artifact@v6
        with:
          name: InstallerPackages
          path: installer/artifacts/packages/Release/Shipping
          if-no-files-found: error
